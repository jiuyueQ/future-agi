name: Verify JSON escape preservation
on:
  push:
    branches: [ci/verify-json-escapes]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: futureagi
    env:
      LITELLM_MODE: PRODUCTION
      DJANGO_SETTINGS_MODULE: tfc.settings.test
      DATABASE_URL: postgres://test_user:test_password@localhost:15432/test_tfc
      REDIS_URL: redis://localhost:16379/0
      REDIS_LOCK_URL: redis://localhost:16379/2
      CH_HOST: localhost
      CH_DATABASE: test_tfc
      CH25_HOST: localhost
      CH25_HTTP_PORT: '18123'
      CH25_DATABASE: test_tfc
      TEST: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.11.16'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: futureagi/uv.lock
      - name: Install the project's CI system dependencies
        run: bash .ci/install-test-packages.sh "$RUNNER_TEMP/futureagi-test-apt"
      - name: Install locked project dependencies
        run: uv sync --frozen
      - name: Start the project's isolated test services
        run: bin/test up
      - name: Run the JSON parser and related evaluator suites
        run: >-
          bin/test
          agentic_eval/core/utils/tests/test_json_utils.py
          agentic_eval/core/utils/tests/test_cpe_clamp.py
          agentic_eval/core/utils/tests/test_cpe_semantic_validation.py
          agentic_eval/core/utils/tests/test_eval_output.py
          agentic_eval/core/utils/tests/test_jinja_utils.py
          agentic_eval/core/utils/tests/test_score.py
          --junitxml=json-escapes-fixed.xml -q
      - name: Prove the regressions fail on the original parser
        run: |
          source_file=agentic_eval/core/utils/json_utils.py
          cp "$source_file" "$RUNNER_TEMP/json_utils.fixed.py"
          trap 'cp "$RUNNER_TEMP/json_utils.fixed.py" "$source_file"' EXIT
          git show da74570db6268d30eaa714bc6e4fdfaa98adaf92:futureagi/agentic_eval/core/utils/json_utils.py > "$source_file"
          set +e
          uv run pytest agentic_eval/core/utils/tests/test_json_utils.py -o addopts= -q --junitxml=json-escapes-before.xml
          result=$?
          set -e
          test "$result" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('json-escapes-before.xml').getroot()
          suites = root.findall('testsuite') if root.tag == 'testsuites' else [root]
          totals = {key: sum(int(s.get(key, 0)) for s in suites) for key in ('tests', 'failures', 'errors', 'skipped')}
          print(totals)
          assert totals == {'tests': 33, 'failures': 18, 'errors': 0, 'skipped': 0}, totals
          PY
      - name: Upload actual test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: json-escape-test-evidence
          path: futureagi/json-escapes-*.xml
          if-no-files-found: ignore
      - name: Show service status on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml -p futureagi-test ps
